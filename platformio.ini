; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
targets = upload, monitor
; PINNED to an explicit pioarduino release. Do not leave this floating: the bare
; name "espressif32" is TWO different platforms from two different repos --
; pioarduino's (arduino-esp32 3.x) and platformio's abandoned official one
; (arduino-esp32 2.0.17) -- and an unpinned entry can silently swap between them.
; 55.03.311 = ESP-IDF 5.5.x + arduino-esp32 3.3.11, released 2026-07-24.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
;board = esp32dev
;board = esp32s3usbotg
;board = adafruit_feather_esp32s3
;board = esp32-s3-devkitc-1
board = seeed_xiao_esp32s3
; https://github.com/pioarduino/platform-espressif32/blob/master/boards/seeed_xiao_esp32s3.json
; XIAO ESP32S3: 8MB flash, 8MB PSRAM, qio_opi
board_build.partitions = parts.csv

board_build.extra_flags =
	-DARDUINO_XIAO_ESP32S3
	-DARDUINO_USB_MODE=1
	-DARDUINO_RUNNING_CORE=0
	-DARDUINO_EVENT_RUNNING_CORE=0
	-DARDUINO_LOOP_STACK_SIZE=16384





framework = arduino
lib_deps =
	tobiasschuerg/ESP8266 Influxdb@^3.13.1
	adafruit/Adafruit ADS1X15@^2.4.0
	wollewald/INA226_WE@^1.2.6
	wollewald/ADS1220_WE@^1.0.17
	;adafruit/Adafruit GFX Library@^1.11.5
	;adafruit/Adafruit SSD1306@^2.5.7
	; NilsMinor/TMP117-Arduino removed: its constructor called Wire.begin() with the
	; variant default pins during static init, which in arduino-esp32 3.x makes
	; main()'s Wire.begin(<board pins>, 400k) a silent no-op and kills the whole bus.
	; src/adc/tmp117.cpp now talks to the part directly over src/i2c.h.
	h2zero/NimBLE-Arduino@2.5.1
	; OTA-over-BLE receiver, shared with fugu-mppt-firmware: https://github.com/fl4p/esp-ota-ble
	; A sibling checkout rather than the git URL, so the module and its consumers can be changed
	; together -- a git dep would pin a fetched copy and ignore local edits. Relative, so this is
	; not tied to one machine; clone esp-ota-ble beside this repo. See esp-ota-ble/README.md.
	symlink://../esp-ota-ble
; The dead `#ifdef USE_ARDUINO_BLE` include of <BLEDevice.h> in src/ble.h still gets
; picked up by the LDF (chain mode does not evaluate preprocessor conditionals), which
; links the core's OWN BLE library. On arduino-esp32 >= 3.3 that library is NimBLE-based
; and collides with h2zero/NimBLE-Arduino at link time ("multiple definition of
; npl_freertos_* / ble_sm_alg_*"). Only ONE BLE stack may be in the binary.
lib_ignore = BLE

upload_speed = 115200
; upload_port = /dev/tty.usbserial-0001
upload_port=/dev/cu.usb*
monitor_port=/dev/cu.usb*
monitor_speed = 115200
;monitor_speed = 460800


; https://github.com/espressif/arduino-esp32/blob/master/cores/esp32/esp32-hal-log.h
; ARDUHAL_LOG_LEVEL_INFO=5 => verbose
monitor_filters = esp32_exception_decoder
build_flags = -O2 -DARDUINO_XIAO_ESP32S3 -DARDUINO_USB_MODE=1 -DARDUINO_RUNNING_CORE=0 -DARDUINO_EVENT_RUNNING_CORE=0
	-D CORE_DEBUG_LEVEL=3
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D PTHREAD_TASK_CORE_DEFAULT=0
	-D FMB_PORT_TASK_AFFINITY=0
	-D MDNS_TASK_AFFINITY=0
	-D ESP_TIMER_ISR_AFFINITY=1
	-D ESP_TIMER_TASK_AFFINITY=1
build_unflags = -Os
build_src_filter = +<*> -<main.cpp> -<main_stm32.cpp> -<esp_compat.h> -<ble_bridge.h> -<ble_protocol.h>




; ---------------------------------------------------------------------------
; Same firmware as [env:esp32s3], but on the OTRONIC ESP32-S3 N16R8 clone carrying
; the pwr-metering shunt-adc board (ADS1262). SHUNT_ADC_ONLY drops the I2C side:
; settings.h hardcodes `#define XIAO_ESP32S3 1`, so the INA228 alerts and mux
; would claim GPIO4/5/6/7 -- the ADS1262 SPI pins on this wiring.
;
; Flash over the chip's NATIVE USB only. The CH343 UART adapter is fine as a
; console and for bulk READS, but every bulk host->chip WRITE is rejected at
; seq 0 regardless of baud (measured 2026-08-14).
; ---------------------------------------------------------------------------
[env:esp32s3_n16r8]
extends = env:esp32s3
; Board: OTRONIC ESP32-S3 N16R8 clone (16 MB Flash, 8 MB OPI PSRAM).
; Read off the actual silicon with `esptool flash-id` on 2026-08-14:
;     ESP32-S3 (QFN56) rev v0.1, MAC 34:85:18:98:15:88
;     flash 16 MB, GigaDevice c8/4018, eFuse says quad (4 data lines), 3.3 V
;     Embedded PSRAM 8 MB (AP_3v3)  -> 8 MB embedded == OCTAL, not quad
; The esp32-s3-devkitc1-n16r8 board ID matches the memory configuration (16 MB
; flash, 8 MB OPI PSRAM, qio_opi memory type), so unlike the previous
; adafruit_feather board ID no memory overrides are needed. It does NOT describe
; this clone's board wiring; the onboard WS2812 pin is configured explicitly
; below.
board = esp32-s3-devkitc1-n16r8
; ARDUINO_USB_MODE=1 puts the console on the chip's ROM USB-Serial/JTAG peripheral,
; not TinyUSB CDC. That port does not respond to the "1200 bps touch" reset and
; never disappears across a reset, so PlatformIO's default Adafruit upload dance
; would just time out with "Couldn't find a board on the selected port". esptool's
; RTS-driven reset works on this path.
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
; `extends` REPLACES an option rather than appending, so both flag lists are
; restated in full here -- minus -DARDUINO_XIAO_ESP32S3, which must not leak into
; this clone build.
board_build.extra_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_RUNNING_CORE=0
	-DARDUINO_EVENT_RUNNING_CORE=0
	-DARDUINO_LOOP_STACK_SIZE=16384
build_flags = -O2 -DARDUINO_USB_MODE=1 -DARDUINO_RUNNING_CORE=0 -DARDUINO_EVENT_RUNNING_CORE=0
	-D SHUNT_ADC_ONLY
	-D CORE_DEBUG_LEVEL=3
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D PTHREAD_TASK_CORE_DEFAULT=0
	-D FMB_PORT_TASK_AFFINITY=0
	-D MDNS_TASK_AFFINITY=0
	-D ESP_TIMER_ISR_AFFINITY=1
	-D ESP_TIMER_TASK_AFFINITY=1
	; GPIO48 is the onboard WS2812 data pin for this board revision.
	; The PCB's normally-open `RGB` solder jumper beside the pixel must be bridged
	; to power it. Lights blue while connected.
	-D BLE_STATUS_NEOPIXEL_PIN=48

[env:stm32h5]
platform = ststm32
board = nucleo_h503rb
framework = arduino
lib_deps =
	stm32duino/STM32duino FreeRTOS@^10.3.3
build_flags =
	-D TARGET_STM32H5
	-D ARDUINO_NUCLEO_H503RB
	-D HAL_PWR_MODULE_ENABLED
	-D PIN_WIRE_SDA=PB7
	-D PIN_WIRE_SCL=PB8
build_unflags = -O2
upload_protocol = mbed
upload_port = /Volumes/NOD_H503RB
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp> -<main_esp32.cpp> -<adc/adc_esp.h> -<adc/adc_esp_dma.h> -<adc/ads1220.h> -<adc/ads1262.h> -<adc/ads1262.cpp> -<adc/ads1262/> -<adc/ads131.h> -<adc/ads131/> -<adc/ina226.h> -<adc/adc_ads.h> -<ble.h> -<lcd.h> -<sui.h> -<secrets.h> -<secrets.h.example>

; see https://docs.platformio.org/en/latest/projectconf/sections/env/options/monitor/index.html

#upload_port = /dev/tty.wchusbserial51850136381
