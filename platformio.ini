; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32]
targets = upload, monitor
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	tobiasschuerg/ESP8266 Influxdb@^3.13.1
	adafruit/Adafruit ADS1X15@^2.4.0
	wollewald/INA226_WE@^1.2.6
	wollewald/ADS1220_WE@^1.0.17
	adafruit/Adafruit GFX Library@^1.11.5
	adafruit/Adafruit SSD1306@^2.5.7

upload_speed = 921600

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags = -DCORE_DEBUG_LEVEL=5


[env:esp32s3]
targets = upload, monitor
; PINNED to an explicit pioarduino release. Do not leave this floating: the bare
; name "espressif32" is TWO different platforms from two different repos --
; pioarduino's (arduino-esp32 3.x) and platformio's abandoned official one
; (arduino-esp32 2.0.17) -- and an unpinned entry can silently swap between them.
; 55.03.311 = ESP-IDF 5.5.x + arduino-esp32 3.3.11, released 2026-07-24.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
;board = esp32dev
;board = esp32s3usbotg
;board = adafruit_feather_esp32s3
board = esp32-s3-devkitc-1
; https://github.com/platformio/platform-espressif32/blob/master/boards/esp32-s3-devkitc-1.json
;board_build.arduino.memory_type = qio_qspi
;board_build.flash_mode = qio
;board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = parts.csv
;board.build_partitions = custom.csv
;board.build_partitions = huge_app.csv

board_build.extra_flags =
	-DARDUINO_ESP32S3_DEV
	-DARDUINO_USB_MODE=1
	-DARDUINO_RUNNING_CORE=0
	-DARDUINO_EVENT_RUNNING_CORE=0
	-DARDUINO_LOOP_STACK_SIZE=16384





framework = arduino
lib_deps =
	tobiasschuerg/ESP8266 Influxdb@^3.13.1
	adafruit/Adafruit ADS1X15@^2.4.0
	wollewald/INA226_WE@^1.2.6
	wollewald/ADS1220_WE@^1.0.17
	;adafruit/Adafruit GFX Library@^1.11.5
	;adafruit/Adafruit SSD1306@^2.5.7
	; NilsMinor/TMP117-Arduino removed: its constructor called Wire.begin() with the
	; variant default pins during static init, which in arduino-esp32 3.x makes
	; main()'s Wire.begin(<board pins>, 400k) a silent no-op and kills the whole bus.
	; src/adc/tmp117.cpp now talks to the part directly over src/i2c.h.
	h2zero/NimBLE-Arduino@2.5.1
	; OTA-over-BLE receiver, shared with fugu-mppt-firmware. Local checkout rather than a git URL
	; so the module and its consumers can be changed together; see esp-ota-ble/README.md.
	symlink:///Users/fab/dev/pv/esp-ota-ble
; The dead `#ifdef USE_ARDUINO_BLE` include of <BLEDevice.h> in src/ble.h still gets
; picked up by the LDF (chain mode does not evaluate preprocessor conditionals), which
; links the core's OWN BLE library. On arduino-esp32 >= 3.3 that library is NimBLE-based
; and collides with h2zero/NimBLE-Arduino at link time ("multiple definition of
; npl_freertos_* / ble_sm_alg_*"). Only ONE BLE stack may be in the binary.
lib_ignore = BLE

upload_speed = 115200
; upload_port = /dev/tty.usbserial-0001
upload_port=/dev/cu.usb*
monitor_port=/dev/cu.usb*
monitor_speed = 115200
;monitor_speed = 460800


; https://github.com/espressif/arduino-esp32/blob/master/cores/esp32/esp32-hal-log.h
; ARDUHAL_LOG_LEVEL_INFO=5 => verbose
monitor_filters = esp32_exception_decoder
build_flags = -O2 -DARDUINO_ESP32S3_DEV -DARDUINO_USB_MODE=1 -DARDUINO_RUNNING_CORE=0 -DARDUINO_EVENT_RUNNING_CORE=0
	-D CORE_DEBUG_LEVEL=3
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D PTHREAD_TASK_CORE_DEFAULT=0
	-D FMB_PORT_TASK_AFFINITY=0
	-D MDNS_TASK_AFFINITY=0
	-D ESP_TIMER_ISR_AFFINITY=1
	-D ESP_TIMER_TASK_AFFINITY=1
build_unflags = -Os




; see https://docs.platformio.org/en/latest/projectconf/sections/env/options/monitor/index.html

#upload_port = /dev/tty.wchusbserial51850136381
; build_flags =  -DDEBUG_SERIAL=Serial
; -DCORE_DEBUG_LEVEL=5



