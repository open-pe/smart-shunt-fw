; ESP32 BLE relay module firmware.
; Receives telemetry over UART from the STM32H5, relays it over BLE
; using the same GATT service/characteristic UUIDs as the original firmware.

[env:esp32_ble_bridge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
	h2zero/NimBLE-Arduino@2.5.1
build_flags =
	-D ARDUINO_ESP32S3_DEV
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=3
	-D ARDUINO_RUNNING_CORE=0
	-D ARDUINO_EVENT_RUNNING_CORE=0
upload_speed = 115200
upload_port = /dev/cu.usb*
monitor_port = /dev/cu.usb*
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -Os
build_flags = -O2
